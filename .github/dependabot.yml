# Cloudflare Workers MCP + AI SDK + Zod
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
          - "agents"
        update-types:
          - minor
          - patch
      mcp-ai:
        patterns:
          - "@modelcontextprotocol/*"
          - "ai"
          - "@ai-sdk/*"
        update-types:
          - minor
          - patch
      schema:
        patterns:
          - "zod"
        update-types:
          - minor
          - patch
      typescript-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
        update-types:
          - minor
          - patch
    # agents は @modelcontextprotocol/sdk を peer に "1.30.0" と exact 指定しており、
    # SDK だけを上げると npm ci が ERESOLVE で失敗する。agents が追いつくまで手動更新。
    ignore:
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
